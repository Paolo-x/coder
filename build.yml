
name: Build EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar EXE unico
        run: dotnet publish GtaCodeOcr.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out

      - name: Descargar EXE
        uses: actions/upload-artifact@v4
        with:
          name: GtaCodeOcr-Windows
          path: out/GtaCodeOcr.exe
