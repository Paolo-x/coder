name: Build EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar EXE unico
        run: dotnet publish GtaCodeOcr.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: GtaCodeOcr-exe
          path: out/GtaCodeOcr.exe
